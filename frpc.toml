# frpc.toml —— 客户端配置（适配 yvvv/frpc 汉化镜像）
# 完整配置参考官方文档：https://gofrp.org/zh-cn/docs/
#
# ⚠️ serverAddr 必填，取值取决于 frpc 与 frps 的网络关系：
#   1) 同机部署（frps 以 host 网络运行，监听宿主机 7000）：
#      - bridge 模式（默认）：填 "host.docker.internal"（compose 已默认开启 extra_hosts 映射）
#      - host 模式（取消 compose 里 network_mode: host）：可填 "127.0.0.1"
#   2) 跨机部署（frps 在另一台有公网 IP 的机器）：填该服务器的 IP 或域名
#   ❌ bridge 模式下填 "127.0.0.1" 是错的：容器内 127.0.0.1 指向容器自身，会连不上。

# 服务端地址与端口（同机 bridge 默认用 host.docker.internal；跨机改成 frps 的公网 IP/域名；端口与 frps 的 bindPort 一致）
serverAddr = "x.zzcz.cc"
serverPort = 7000

# 鉴权 token（必须与 frps 的 auth.token 完全一致）
auth.method = "token"
auth.token = "159357456258"

# 日志
log.to = "console"
log.level = "info"
log.maxDays = 3

# ===== Web 管理面板（可选）=====
# 访问地址：http://<本机IP>:7400  （bridge 模式需在 compose 里映射 7400:7400）
webServer.addr = "0.0.0.0"
webServer.port = 7400
webServer.user = "admin"
webServer.password = "请修改为强密码"

# ===== 以下为示例代理，按需删改 =====

# 示例1：把本机 SSH(22) 通过 frps 暴露到公网，访问地址为 <服务器IP>:6000
[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6000

# 示例2：把本机 80 端口的 Web 服务以子域名方式暴露（需 frps 开启 vhostHTTPPort）
# [[proxies]]
# name = "web"
# type = "http"
# localIP = "127.0.0.1"
# localPort = 80
# customDomains = ["your.domain.com"]

# 注：本镜像已将中文界面编译进二进制，无需 assetsDir；如需自定义静态资源再另行挂载。
