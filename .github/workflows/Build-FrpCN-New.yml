name: Build Frp Chinese Docker images New

# 触发方式：
#   1. 定时：每天 UTC 03:00 检查 fatedier/frp 是否有新 release（默认构建全部 frps+frpc）
#   2. 手动：Actions 页面 → Run workflow，可填指定版本（如 0.71.0）
#           可勾选 build_frps / build_frpc 选择只构建其中一个；默认都不勾=都构建
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '指定 frp 版本（如 0.71.0），留空则自动取上游最新'
        required: false
      build_frps:
        description: '☑️ 构建 frps 镜像（不勾则跳过）'
        type: boolean
        default: false
      build_frpc:
        description: '☑️ 构建 frpc 镜像（不勾则跳过）'
        type: boolean
        default: false

permissions:
  contents: write   # 用于构建后回写 VERSION 文件
  issues: write     # 用于汉化补丁失配时自动开 issue 提醒

concurrency:
  group: build-frp-hanhua
  cancel-in-progress: false

jobs:
  # ---------- 第一步：判断是否真的需要构建 ----------
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      build_frps: ${{ steps.decide.outputs.build_frps }}
      build_frpc: ${{ steps.decide.outputs.build_frpc }}
    steps:
      - name: Check Server Performance
        run: |
          echo "CPU核心: $(nproc)"
          echo "CPU型号: $(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')"
          echo "内存: $(free -h | grep Mem | awk '{print $2}')"

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 获取上游最新版本号
        id: upstream
        run: |
          tag=$(curl -s https://api.github.com/repos/fatedier/frp/releases/latest | jq -r .tag_name)
          echo "上游 tag=$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: 读取本仓库已构建版本
        id: local
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: 决策
        id: decide
        env:
          # 仅 workflow_dispatch 且填写了版本时取手动版本，否则留空走上游最新
          DISPATCH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          DISPATCH_FRPS: ${{ github.event_name == 'workflow_dispatch' && inputs.build_frps || '' }}
          DISPATCH_FRPC: ${{ github.event_name == 'workflow_dispatch' && inputs.build_frpc || '' }}
        run: |
          # 定时任务：两个都构建；手动：按勾选（都不勾=都构建）
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BUILD_FRPS=true
            BUILD_FRPC=true
          else
            # 手动触发：都不勾选时默认两个都构建；勾了哪个就至少建那个
            if [ "$DISPATCH_FRPS" != "true" ] && [ "$DISPATCH_FRPC" != "true" ]; then
              BUILD_FRPS=true
              BUILD_FRPC=true
            else
              BUILD_FRPS=$DISPATCH_FRPS
              BUILD_FRPC=$DISPATCH_FRPC
            fi
          fi
          echo "build_frps=$BUILD_FRPS" >> "$GITHUB_OUTPUT"
          echo "build_frpc=$BUILD_FRPC" >> "$GITHUB_OUTPUT"

          if [ -n "$DISPATCH_VERSION" ]; then
            # 手动指定版本：强制构建（即使与本地 VERSION 相同，也可用于把当前 tag 重建成多架构等）
            echo "build=true"  >> "$GITHUB_OUTPUT"
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            VER="${{ steps.upstream.outputs.version }}"
            if [ "$VER" != "${{ steps.local.outputs.version }}" ]; then
              echo "build=true"  >> "$GITHUB_OUTPUT"
              echo "version=$VER" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "无新版本，跳过构建（本地 VERSION=${{ steps.local.outputs.version }} == 上游 ${{ steps.upstream.outputs.version }}）"
            fi
          fi
          echo "决策: build=${{ steps.decide.outputs.build }} frps=$BUILD_FRPS frpc=$BUILD_FRPC"

  # ---------- 第二步：克隆源码 → 打汉化补丁 → 编译 → 推 DockerHub ----------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD_FRPS: ${{ needs.check.outputs.build_frps }}
      BUILD_FRPC: ${{ needs.check.outputs.build_frpc }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 克隆 frp v${{ env.VERSION }} 源码
        run: git clone --depth 1 --branch "v${{ env.VERSION }}" https://github.com/fatedier/frp.git 代码

      # ---------- 自动汉化（规则驱动，无需 manual.patch，完全脱离本地） ----------
      # 汉化资产(hanhua/*.json + hanhua/汉化.ts)已随仓库 checkout，
      # 这里用 Bun 跑 hanhua/汉化.ts 把中文规则灌入 代码/ 源码（原地覆盖）。
      - name: 安装 Bun 运行时
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 应用汉化规则（hanhua/汉化.ts → 代码/）
        id: hanhua
        run: |
          if ! bash scripts/apply-hanhua.sh; then
            echo "HANHUA_FAILED=true" >> "$GITHUB_ENV"
          fi

      # 上游升级导致英文串变更、规则失效时，开 issue 提醒刷新 hanhua/*.json，而非静默失败
      - name: 汉化失败 → 开 issue 报警
        if: env.HANHUA_FAILED == 'true'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `汉化规则在 frp v${{ needs.check.outputs.version }} 上应用失败，请刷新`,
              body: `上游已更新到 v${{ needs.check.outputs.version }}，部分 \`hanhua/*.json\` 规则无法匹配（规则文件缺失或英文原文串已变更）。\n\n请本地按 \`hanhua/汉化和修改.md\` 的映射，更新对应规则 json 后提交：\n\`\`\`bash\n# 1. 克隆 frp v${{ needs.check.outputs.version }} 到 代码/\n# 2. 修改 汉化/ 下失配的规则 json（原文串需与上游一致）\n# 3. 提交，重新 Run workflow\n\`\`\``,
              labels: ['汉化待更新']
            })

      - name: 汉化失败 → 中止本任务
        if: env.HANHUA_FAILED == 'true'
        run: exit 1

      - name: 安装 Node.js (前端编译)
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: 编译前端 (按勾选)
        run: |
          set -e
          cd 代码/web
          npm install --no-audit --no-fund
          BUILT=""
          if [ "$BUILD_FRPS" = "true" ]; then
            cd frps && npm install --no-audit --no-fund && npm run build-only && cd ..
            BUILT="frps"
          fi
          if [ "$BUILD_FRPC" = "true" ]; then
            cd frpc && npm install --no-audit --no-fund && npm run build-only && cd ..
            BUILT="$BUILT frpc"
          fi
          # 校验已编译的前端产物非空 —— dist 空或缺失会导致 //go:embed dist 内嵌空白，dashboard 无 UI
          for d in $BUILT; do
            if [ ! -s "$d/dist/index.html" ] || [ -z "$(ls $d/dist/*.js 2>/dev/null)" ]; then
              echo "[FAIL] $d/dist 前端产物缺失或为空，请检查 npm run build-only 是否成功"
              exit 1
            fi
            echo "[OK] $d 前端产物: $(ls $d/dist/ | tr '\n' ' ')"
          done

      - name: 准备 Docker 多架构构建环境
        uses: docker/setup-qemu-action@v4.2.0
      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: 登录 DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 单 tag 多架构合并：amd64 + arm64 合并进同一个 :VERSION / :latest 标签。
      # no-cache: true —— 避免 buildx 复用 frps 构建产生的缓存层（COPY 代码 被判 CACHED），
      # 导致 frpc 嵌入旧/空 dist，dashboard 出现空白页（/api 有数据但 UI 无内容）。
      - name: 构建并推送 frps (amd64 + arm64 合并)
        if: env.BUILD_FRPS == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile-frps
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frps:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frps:latest

      - name: 构建并推送 frpc (amd64 + arm64 合并)
        if: env.BUILD_FRPC == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile-frpc
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frpc:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frpc:latest

      # 构建成功后，把 VERSION 回写为本次版本，下次定时任务据此跳过
      - name: 回写 VERSION 并提交
        if: success()
        run: |
          echo "${{ env.VERSION }}" > VERSION
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: 构建 frp 汉化 v${{ env.VERSION }}"
            git push
          else
            echo "VERSION 未变化，跳过提交"
          fi
