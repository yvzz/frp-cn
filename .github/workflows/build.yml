name: 构建 frp 汉化镜像

# 触发方式：
#   1. 定时：每天 UTC 03:00 检查 fatedier/frp 是否有新 release
#   2. 手动：Actions 页面 → Run workflow，可填指定版本（如 0.71.0）
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '指定 frp 版本（如 0.71.0），留空则自动取上游最新'
        required: false

permissions:
  contents: write   # 用于构建后回写 VERSION 文件
  issues: write     # 用于汉化补丁失配时自动开 issue 提醒

concurrency:
  group: build-frp-hanhua
  cancel-in-progress: false

jobs:
  # ---------- 第一步：判断是否真的需要构建 ----------
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 获取上游最新版本号
        id: upstream
        run: |
          tag=$(curl -s https://api.github.com/repos/fatedier/frp/releases/latest | jq -r .tag_name)
          echo "上游 tag=$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: 读取本仓库已构建版本
        id: local
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: 决策
        id: decide
        env:
          # 仅 workflow_dispatch 且填写了版本时取手动版本，否则留空走上游最新
          DISPATCH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            # 手动指定版本：强制构建（即使与本地 VERSION 相同，也可用于把当前 tag 重建成多架构等）
            echo "build=true"  >> "$GITHUB_OUTPUT"
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            VER="${{ steps.upstream.outputs.version }}"
            if [ "$VER" != "${{ steps.local.outputs.version }}" ]; then
              echo "build=true"  >> "$GITHUB_OUTPUT"
              echo "version=$VER" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "无新版本，跳过构建（本地 VERSION=${{ steps.local.outputs.version }} == 上游 ${{ steps.upstream.outputs.version }}）"
            fi
          fi

  # ---------- 第二步：克隆源码 → 打汉化补丁 → 编译 → 推 DockerHub ----------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 克隆 frp v${{ env.VERSION }} 源码
        run: git clone --depth 1 --branch "v${{ env.VERSION }}" https://github.com/fatedier/frp.git 代码

      - name: 应用汉化补丁（patch/manual.patch）
        run: |
          if ! git -C 代码 apply patch/manual.patch; then
            echo "PATCH_FAILED=true" >> "$GITHUB_ENV"
          fi

      # 上游升级导致补丁失配时，开 issue 提醒人工刷新，而不是静默失败
      - name: 补丁失配 → 开 issue 报警
        if: env.PATCH_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `汉化补丁在 frp v${{ needs.check.outputs.version }} 上应用失败，请刷新`,
              body: `上游已更新到 v${{ needs.check.outputs.version }}，但 \`patch/manual.patch\` 无法干净应用。\n\n请本地重新生成补丁后提交：\n\`\`\`bash\nbash scripts/build.sh ${{ needs.check.outputs.version }}\n# 生成新补丁\ncd 代码 && git diff > ../patch/manual.patch\n\`\`\``,
              labels: ['汉化待更新']
            })

      - name: 补丁失败 → 中止本任务
        if: env.PATCH_FAILED == 'true'
        run: exit 1

      - name: 安装 Node.js (前端编译)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 编译前端 (frps / frpc)
        run: |
          cd 代码/web
          npm install --no-audit --no-fund
          (cd frps && npm install --no-audit --no-fund && npm run build-only)
          (cd frpc && npm install --no-audit --no-fund && npm run build-only)

      - name: 准备 Docker 多架构构建环境
        uses: docker/setup-qemu-action@v3
      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 单 tag 多架构合并：amd64 + arm64 合并进同一个 :VERSION / :latest 标签。
      # Docker 会按宿主机架构自动拉取对应镜像，无需 -arm64 单独标签。
      - name: 构建并推送 frps (amd64 + arm64 合并)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-frps
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frps:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frps:latest

      - name: 构建并推送 frpc (amd64 + arm64 合并)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-frpc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frpc:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/frpc:latest

      # 构建成功后，把 VERSION 回写为本次版本，下次定时任务据此跳过
      - name: 回写 VERSION 并提交
        if: success()
        run: |
          echo "${{ env.VERSION }}" > VERSION
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: 构建 frp 汉化 v${{ env.VERSION }}"
            git push
          else
            echo "VERSION 未变化，跳过提交"
          fi
