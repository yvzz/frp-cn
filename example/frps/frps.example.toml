# frps.toml —— 服务端配置示例模板（适配 yvvv/frps 汉化镜像）
# 完整配置参考官方文档：https://gofrp.org/zh-cn/docs/
#
# 用法：复制本文件为 frps.toml 后，把下方 <占位符> 改成你自己的值。
#       docker compose 只会挂载 ./frps.toml，不会读取本示例文件。

# 客户端连接端口（host 模式下即直接绑宿主机 7000）
bindPort = 7000

# Web 控制台（host 模式下直接绑宿主机 7500，浏览器访问 http://<服务器IP>:7500）
webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "<控制台账号>"
webServer.password = "<控制台密码>"

# 鉴权 token（所有 frpc 客户端必须填写一致的值）
auth.method = "token"
auth.token = "<改成你自己的强随机token>"

# 启用 HTTP/HTTPS 类型代理时需放开对应 vhost 端口
# host 模式：直接绑宿主机 80/443，需 compose 加 cap_add: NET_BIND_SERVICE
# bridge 模式：绑容器内部 80/443，同样需 cap_add，再经 ports 映射到宿主机
vhostHTTPPort = 80
vhostHTTPSPort = 443

# 日志
log.to = "console"
log.level = "info"
log.maxDays = 3

# 注：本镜像已将中文界面编译进二进制，无需 assetsDir；如需自定义静态资源再另行挂载。
