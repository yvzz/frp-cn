# frps 服务端部署（基于你自己的 DockerHub 汉化镜像）
# 镜像：yvvv/frps  —— 已内嵌中文网页界面，无需额外挂载静态资源
# 配置：./frps.toml 挂载到容器内 /frp/frps.toml（镜像固定以 -c /frp/frps.toml 启动）

services:
  frps:
    # 镜像已是 amd64+arm64 多架构合并标签，Docker 会按宿主机架构自动拉取对应镜像
    image: yvvv/frps:0.71.0
    # 也可改用 :latest 标签，始终指向最新汉化版：
    # image: yvvv/frps:latest
    container_name: frps
    restart: unless-stopped
    # ===== 网络模式二选一 =====
    # 1) bridge（推荐，跨平台兼容：macOS / Linux / Windows 都能跑）
    #    frps 监听容器内部端口，通过下方 ports 映射到宿主机。
    ports:
      - "7000:7000"     # 客户端连接端口
      - "7500:7500"     # Web 控制台（浏览器访问 http://<服务器IP>:7500）
      - "80:80"         # HTTP 代理 vhost 端口（启用 HTTP 代理时放开）
      - "443:443"       # HTTPS 代理 vhost 端口（启用 HTTPS 代理时放开）
    # 2) host（仅 Linux 有效，如 FnOS/群晖/裸机；macOS Docker Desktop 不支持 host 模式）
    #    直接监听宿主机端口，下方 ports 映射失效，把上面 ports 整段删掉并取消下面两行注释：
    # network_mode: host
    # 开启 host 且 vhostHTTPPort/vhostHTTPSPort 用到 80/443 等特权端口时，
    # 必须放行 NET_BIND_SERVICE 能力，否则 frps 启动即退出（报 exit code 1 / 构建失败）。
    # cap_add:
    #   - NET_BIND_SERVICE
    volumes:
      # 注意：不要加 :ro，否则 Web 面板"更新并重载"写回 /frp/frps.toml 会失败(HTTP 500)
      # 用 ${PWD} 绝对路径，无论从哪个目录执行 docker compose -f 都能正确找到配置文件
      - ${PWD}/frps.toml:/frp/frps.toml
    # 如需持久化日志，可取消下面这行并自行在 frps.toml 里把 log.to 改为文件：
    # - ./logs:/var/log/frps
