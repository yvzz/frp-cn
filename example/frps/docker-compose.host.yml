# frps 服务端部署 —— host 网络模式（适配 yvvv/frps 汉化镜像）
# 适用：Linux 宿主机（FnOS / 群晖 / 裸机 / 服务器）
# 说明：
#   - host 模式下 frps 直接监听宿主机端口，上面的 ports 映射段失效，故删除。
#   - 本文件用 `docker compose -f docker-compose.host.yml up -d` 启动，
#     不是 `build`（compose 里没有 build 段，直接引用现成镜像 yvvv/frps:0.71.0）。
#   - vhostHTTPPort / vhostHTTPSPort 已设为非特权端口 8080/8443，
#     因为 NAS / 服务器常自带 nginx 占用 0.0.0.0:80/443，host 模式直接绑 80/443 会
#     端口冲突 → frps 启动即退出（容器 Restarting）。如确需真 80/443，先停占用服务
#     或改用 docker-compose.yml（bridge 版）+ ports 映射。
#   - cap_add: NET_BIND_SERVICE 保留：若日后改回 <1024 特权端口仍可绑。
#   - macOS 上 Docker Desktop 的虚拟化框架已支持 host 网络，实际可跑；但生产建议放 Linux 宿主机。

services:
  frps:
    image: yvvv/frps:0.71.0
    # 或 image: yvvv/frps:latest
    container_name: frps
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      # 注意：不要加 :ro，否则 Web 面板“更新并重载”写回 /frp/frps.toml 会失败(HTTP 500)
      # 用 ${PWD} 绝对路径，无论从哪个目录执行 docker compose -f 都能正确找到配置文件
      - ${PWD}/frps.toml:/frp/frps.toml
    # 如需持久化日志，可取消下面这行并在 frps.toml 里把 log.to 改为文件：
    # - ./logs:/var/log/frps
